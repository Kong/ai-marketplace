[tools]
node = "24.20.0"
python = "3.12"

[env]
UV_CACHE_DIR = ".tmp/uv-cache"
UV_PYTHON = "3.12"
UV_PYTHON_INSTALL_DIR = ".tmp/uv-python"

[tasks.preflight]
description = "Check local prerequisites for contributor workflows"
run = "python scripts/preflight.py"

[tasks.deps]
description = "Sync Python dependencies with uv"
run = "uv sync --python 3.12 --cache-dir .tmp/uv-cache"

[tasks."skill:new"]
description = "Scaffold a new skill"
run = "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/scaffold_skill.py skill"

[tasks."plugin:new"]
description = "Scaffold a new plugin package"
run = "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/scaffold_skill.py plugin"

[tasks.gen]
description = "Sync generated repo metadata and skill listings"
run = "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/check_repo.py --fix"

[tasks.lint]
description = "Validate manifests, skills, and generated content"
run = [
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/check_repo.py",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/validate_routing_scenarios.py",
]

[tasks.ci]
description = "Run the same validation used in CI"
run = [
  { task = "lint" },
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_openai_package.py",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_routing_scenarios.py",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_routing_workspace.py",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_routing_results.py",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_routing_compare.py",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_routing_ceilings.py",
  "node --test evals/promptfoo/scenarios.test.js evals/promptfoo/codex.config.test.js evals/promptfoo/settings.test.js",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_routing_settings.py",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_routing_agents.py",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_select_changed.py",
  "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/test_routing_targets.py",
  "gh skill publish --dry-run",
]

[tasks."eval:routing"]
description = "Run the routing eval on Claude and Codex, reported separately: mise run eval:routing -- changed | skill <name> | all"
usage = '''
arg "<mode>" help="changed: skills changed since --base; skill: one named skill; all: every skill with scenarios" {
  choices "changed" "skill" "all"
}
arg "[name]" help="Target skill name (skill mode only)"
flag "--base <ref>" help="Git base for changed mode (default: origin/main, else main)"
flag "--agent <agent>" var=#true help="Run only this agent (claude or codex; repeatable or comma-separated). Default: both. A subset run is marked partial."
'''
env = { PROMPTFOO_CONFIG_DIR = ".tmp/promptfoo", PROMPTFOO_DISABLE_TELEMETRY = "1", PROMPTFOO_DISABLE_UPDATE = "1" }
run = [
  "npm ci --ignore-scripts --no-audit --no-fund",
  # Workspaces only for the selected agents; an unknown agent exits 2 here, before any run.
  "agents=$(uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/routing_agents.py $usage_agent) || exit 2; for agent in $agents; do uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/prepare_routing_workspace.py .tmp/routing/$agent --host $agent || exit $?; done",
  # Resolves the mode to skills, then per skill: validates scenarios, runs each host independently,
  # retries infrastructure errors once, and reduces each host to pass, routing_fail, or infra_error.
  # Every skill runs; worst exit wins: harness error (2 or other) > 1 routing_fail > 3 infra_error (see docs/testing.md).
  "targets=$(uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/routing_targets.py {{usage.mode}} '{{usage.name}}' ${usage_base:+--base \"$usage_base\"}) || exit 2; agents=$(uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/routing_agents.py $usage_agent) || exit 2; agent_args=; for agent in $agents; do agent_args=\"$agent_args --agent $agent\"; done; rc=0; for skill in $targets; do uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/run_routing_eval.py $skill $agent_args; r=$?; case $r in 0) ;; 1) [ $rc -eq 2 ] || rc=1 ;; 3) [ $rc -eq 0 ] && rc=3 ;; *) rc=2 ;; esac; done; exit $rc",
]

[tasks."eval:routing:compare"]
description = "Compare one skill's routing with its merge base, per host: mise run eval:routing:compare -- <name> [--base <ref>]"
usage = '''
arg "<name>" help="Skill name; a skill absent at the merge base is judged on absolute thresholds"
flag "--base <ref>" default="origin/main" help="Ref whose merge base with HEAD is the control"
flag "--agent <agent>" var=#true help="Run only this agent (claude or codex; repeatable or comma-separated). Default: both. A subset run is marked partial."
'''
env = { PROMPTFOO_CONFIG_DIR = ".tmp/promptfoo", PROMPTFOO_DISABLE_TELEMETRY = "1", PROMPTFOO_DISABLE_UPDATE = "1" }
run = [
  "npm ci --ignore-scripts --no-audit --no-fund",
  # Materializes isolated candidate and control workspaces itself. Exit codes: see docs/testing.md.
  "agent_args=; for agent in $usage_agent; do agent_args=\"$agent_args --agent $agent\"; done; uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/run_routing_comparison.py {{usage.name}} --base {{usage.base}} $agent_args",
]

[tasks."eval:routing:config"]
description = "Print effective routing eval model/effort, fixed settings, trial policy and ceilings (offline): mise run eval:routing:config -- [--json]"
run = "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/print_routing_config.py"

[tasks."release:prepare"]
description = "Update manifest versions for a release commit"
run = "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/release_prepare.py"

[tasks."hooks:install"]
description = "Install repo-local git hooks"
run = "git config core.hooksPath .githooks"

[tasks."package:openai"]
description = "Build the Kong Konnect OpenAI submission ZIP from tracked package files"
run = "uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/build_openai_plugin.py"
