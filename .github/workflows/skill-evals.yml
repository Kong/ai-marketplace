name: Skill routing evals

# Routing evals can gate merges to main, with cost control. Behaviour per event (details,
# pass criteria and the admin setup checklist: docs/testing.md#routing-evals):
#
#   pull_request    `select` previews the relevant skills (no provider calls, no secrets);
#                   `evaluate` is skipped; `routing-evals-gate` passes immediately.
#   merge_group     only skills whose routing surface changed (SKILL.md name/description, new, deleted,
#                   renamed) or whose scenarios were edited are evaluated, once for the queued commit,
#                   at scenario level (own file plus scenarios elsewhere that name the skill). The
#                   candidate runs one trial per scenario; only failures are confirmed, and only those
#                   still failing run on the merge-base control. Then `routing-evals-gate` applies
#                   scripts/routing_gate.py and fails per the policy.
#   workflow_dispatch  manual: one skill, the changed skills, or the full suite (`all`, both agents,
#                   every skill with scenarios, behind the `skill-evals-full` approval environment).
#                   The full suite is manual only and never part of the gate. `canary` is the eval of the
#                   eval: one skill's description is replaced by off-domain text and its own positive
#                   scenarios must stop routing (scripts/routing_canary.py). It uses the `skill-evals`
#                   environment, fails the evaluate job when the harness does not notice, and never
#                   affects the merge gate.
#
# The gate is not enabled by this file. Until an admin makes the check `routing-evals-gate` required
# in the main ruleset, every outcome here is advisory. There is deliberately no `paths:` filter: the
# check must report on every pull request and queue entry, and `select` decides relevance from the
# base/head diff (no skill with a changed routing surface, nothing paid runs, the gate passes).
#
# Only `evaluate` receives secrets, as environment secrets (`skill-evals` for the queue and manual
# changed/skill runs, `skill-evals-full` for the manual full suite). Workflow inputs reach scripts only
# through environment variables. Ceilings (tokens, cost, per-run and job timeouts, concurrency) come
# from scripts/routing_ceilings.py and the ROUTING_* repository variables. Model and effort overrides
# are never read in CI.

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: "skill: one skill vs origin/main; changed: skills changed vs origin/main; all: full suite (manual only, needs approval); canary: damage one skill's description and check the eval notices"
        required: true
        type: choice
        default: changed
        options:
          - skill
          - changed
          - all
          - canary
      skill:
        description: Skill name (required when mode is skill or canary; must have routing scenarios)
        required: false
        type: string
      agents:
        description: Optional comma-separated agents to run (claude, codex); default both
        required: false
        type: string
      alias:
        description: "Canary only: force opaque skill aliases on or off for this run (default: the repo default, off; on suppresses Claude routing)"
        required: false
        type: choice
        default: default
        options:
          - default
          - "on"
          - "off"
      listing:
        description: "Claude only, diagnosis (modes skill, changed, canary; needs agents=claude): skill-listing preset. wide: raise the listing budget so every description is listed; name-only: list names without descriptions. Ignored for mode all"
        required: false
        type: choice
        default: default
        options:
          - default
          - wide
          - name-only

permissions: {}

concurrency:
  # Manual dispatches differing in mode, skill, alias, listing or agents run side by side; an identical repeat cancels.
  group: skill-evals-${{ github.event.pull_request.number || github.event.merge_group.head_ref || format('{0}-{1}-{2}-{3}-{4}', inputs.mode, inputs.skill, inputs.alias, inputs.listing, inputs.agents) }}
  # A queue entry is never cancelled by a later one: the queue needs every result.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  select:
    name: Select relevant skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skills: ${{ steps.select.outputs.skills }}
      has_skills: ${{ steps.select.outputs.has_skills }}
      agents: ${{ steps.select.outputs.agents }}
      skipped: ${{ steps.select.outputs.skipped }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Select skills from the base/head diff and preview them (no provider calls)
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          MODE_INPUT: ${{ inputs.mode }}
          SKILL_INPUT: ${{ inputs.skill }}
          AGENTS_INPUT: ${{ inputs.agents }}
          ALIAS_INPUT: ${{ inputs.alias }}
          LISTING_INPUT: ${{ inputs.listing }}
          ROUTING_MAX_COST_USD: ${{ vars.ROUTING_MAX_COST_USD }}
        run: uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/routing_ci.py select

  evaluate:
    name: Routing evals (${{ matrix.skill }}, ${{ matrix.mode }})
    needs: select
    # Nothing paid ever runs on a pull request push.
    if: ${{ github.event_name != 'pull_request' && needs.select.outputs.has_skills == 'true' }}
    # Both environments require reviewer approval (docs/testing.md admin checklist); the full suite uses its own.
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'all') && 'skill-evals-full' || 'skill-evals' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.select.outputs.skills) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Evaluate on the requested agents that have API keys (regression-only, lazy control vs merge base)
        env:
          SKILL: ${{ matrix.skill }}
          MODE: ${{ matrix.mode }}
          SCENARIOS: ${{ matrix.scenarios }}
          BASE_REF: ${{ github.event.merge_group.base_sha || 'origin/main' }}
          REQUESTED_AGENTS: ${{ needs.select.outputs.agents }}
          ALIAS_INPUT: ${{ inputs.alias }}
          # An allowlisted preset name only (scripts/routing_listing.py); routing_ci.py applies it for manual skill, changed and canary runs.
          LISTING_INPUT: ${{ inputs.listing }}
          EVENT_NAME: ${{ github.event_name }}
          MODE_INPUT: ${{ inputs.mode }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Empty values fall back to the defaults in scripts/routing_ceilings.py.
          ROUTING_MAX_TOKENS: ${{ vars.ROUTING_MAX_TOKENS }}
          ROUTING_MAX_COST_USD: ${{ vars.ROUTING_MAX_COST_USD }}
          ROUTING_MAX_CONCURRENCY: ${{ vars.ROUTING_MAX_CONCURRENCY }}
          ROUTING_RUN_TIMEOUT_SECONDS: ${{ vars.ROUTING_RUN_TIMEOUT_SECONDS }}
          ROUTING_JOB_TIMEOUT_SECONDS: ${{ vars.ROUTING_JOB_TIMEOUT_SECONDS }}
        # scripts/routing_ci.py drops ROUTING_*_MODEL/EFFORT (CI always uses the pins), reads only whether
        # each key is set (never its value), and records the outcome for the gate job.
        run: uv run --python 3.12 --cache-dir .tmp/uv-cache python scripts/routing_ci.py evaluate
      - name: Upload Promptfoo JSON (raw responses), JUnit, HTML, run record, and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The attempt keeps a re-run of failed jobs from colliding with the first attempt's artifact.
          name: routing-reports-${{ matrix.mode }}-${{ matrix.skill }}-${{ github.run_attempt }}
          path: |
            .tmp/routing/reports/
            .tmp/promptfoo/logs/
          include-hidden-files: true
          if-no-files-found: warn
          # 10 days is the repository maximum.
          retention-days: 10

  routing-evals-gate:
    name: routing-evals-gate
    needs: [select, evaluate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Pass fast on pull requests and when nothing relevant was selected
        id: pre
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECT_RESULT: ${{ needs.select.result }}
          HAS_SKILLS: ${{ needs.select.outputs.has_skills }}
          SKIPPED: ${{ needs.select.outputs.skipped }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MODE_INPUT" = "canary" ]; then
            echo "### routing-evals-gate: canary run, not a gate decision
          The canary verdict is the result of the evaluate job; it never affects the merge gate." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ "$SELECT_RESULT" = "success" ] || echo "::warning title=select::the select job did not succeed; the merge queue run will fail if the problem persists"
            echo "### routing-evals-gate: pull request push, nothing paid runs
          The relevant evals run once in the merge queue; see the Select job summary for the no-spend preview." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SELECT_RESULT" != "success" ]; then
            echo "::error title=select::the select job did not succeed ($SELECT_RESULT); failing closed"
            exit 1
          fi
          if [ "$HAS_SKILLS" != "true" ]; then
            echo "### routing-evals-gate: pass
          No skill with a changed routing surface and no edited scenario; nothing was evaluated." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$SKIPPED" ] && [ "$(jq 'length' <<<"$SKIPPED")" -gt 0 ]; then
              { echo; echo "Skipped:"; jq -r '.[] | "- \(.skill): \(.reason)"' <<<"$SKIPPED"; } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "apply=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        if: ${{ steps.pre.outputs.apply == 'true' }}
        with:
          ref: ${{ github.event.merge_group.head_sha || github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.pre.outputs.apply == 'true' }}
        with:
          pattern: routing-reports-*
          path: .tmp/gate
      - name: Apply the gate policy to the evaluate results
        if: ${{ steps.pre.outputs.apply == 'true' }}
        env:
          MATRIX: ${{ needs.select.outputs.skills }}
          # The full suite is informational: it reports its verdict but never fails on routing results.
          INFORMATIONAL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'all' }}
        run: |
          set -euo pipefail
          printf '%s' "$MATRIX" > .tmp/gate-matrix.json
          flags=()
          [ "$INFORMATIONAL" = "true" ] && flags+=(--informational)
          set +e
          python3 scripts/routing_gate.py .tmp/gate .tmp/gate-matrix.json "${flags[@]}" --summary "$GITHUB_STEP_SUMMARY" --json .tmp/gate-verdict.json
          rc=$?
          set -e
          if [ -f .tmp/gate-verdict.json ]; then
            jq -r '.reasons[] | "\(if (.code | IN("agent_skipped","regression_not_confirmed","preexisting_failure")) then "warning" else "error" end) title=\(.code)::\(.skill)\(if .agent then "/" + .agent else "" end): \(.detail)"' .tmp/gate-verdict.json | sed 's/^/::/'
          fi
          exit "$rc"
