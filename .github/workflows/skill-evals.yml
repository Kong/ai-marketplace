name: Skill routing evals

# Advisory only: never configure these jobs as required checks. Model-backed routing
# results are reported as warnings and artifacts; deterministic validation stays in
# validate.yml (`mise run ci`).
#
# Paid provider calls happen only in `evaluate`, which runs only when `select` finds at
# least one changed skill that has routing scenarios. Changed skills run
# the candidate/merge-base comparison (3 trials); adjacent skills (at most five, from
# select_changed.py) run candidate-only with one trial each. Pull requests are triggered only by
# paths beneath a skill directory, then the diff is re-checked by scripts/select_changed.py
# (via routing_targets.py). Nothing here ever selects the full catalog.
#
# Ceilings: the changed-skill job targets ten minutes (`timeout-minutes`, plus an eval
# deadline below it so a breach is reported rather than the job cancelled). Token, cost,
# per-run timeout, and Promptfoo concurrency ceilings are enforced by scripts/routing_ceilings.py;
# override defaults with repository variables named ROUTING_*. A breach is an advisory
# infra_error shown in the summary and a warning annotation. Runs for one PR share a
# concurrency group (newer pushes cancel older runs) and `max-parallel` bounds paid jobs.

on:
  pull_request:
    paths:
      - "plugins/*/skills/**"
  workflow_dispatch:
    inputs:
      skill:
        description: Name of one skill with routing scenarios to evaluate against origin/main
        required: true
        type: string

permissions: {}

concurrency:
  group: skill-evals-${{ github.event.pull_request.number || inputs.skill }}
  cancel-in-progress: true

jobs:
  select:
    name: Select changed skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skills: ${{ steps.select.outputs.skills }}
      has_skills: ${{ steps.select.outputs.has_skills }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Select skills from the base/head diff
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKILL_INPUT: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          run_py() { uv run --python 3.12 --cache-dir .tmp/uv-cache python "$@"; }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            targets="$(run_py scripts/routing_targets.py skill "$SKILL_INPUT")"
            adjacent=""
          else
            # Show the confirmed diff-derived selection (changed, adjacent, removed, ignored).
            {
              echo '### Skills selected from the diff'
              echo '```json'
              run_py scripts/select_changed.py "$BASE_SHA" HEAD
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Changed skills that have routing scenarios; fails rather than selecting the whole catalog.
            # A new skill below the scenario minimums fails here (exit 2) before any provider call.
            targets="$(run_py scripts/routing_targets.py changed --base "$BASE_SHA")"
            # Adjacent skills that have scenarios; the rest are skipped with a note on stderr.
            adjacent="$(run_py scripts/routing_targets.py adjacent --base "$BASE_SHA")"
          fi
          skills="$(printf '%s\n' "$targets" | jq -R 'select(length > 0)' | jq -sc .)"
          # Adjacent skills are only context for a changed skill that is evaluated; never run alone.
          [ "$skills" = "[]" ] && adjacent=""
          adjacent_skills="$(printf '%s\n' "$adjacent" | jq -R 'select(length > 0)' | jq -sc .)"
          # One matrix: changed skills compare with the merge base, adjacent ones run candidate-only.
          matrix="$(jq -nc --argjson c "$skills" --argjson a "$adjacent_skills" '[($c[] | {skill: ., mode: "compare"}), ($a[] | {skill: ., mode: "adjacent"})]')"
          has_skills="$(jq -r 'length > 0' <<<"$matrix")"
          echo "skills=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_skills=$has_skills" >> "$GITHUB_OUTPUT"
          if [ "$has_skills" != "true" ]; then
            echo "No changed or adjacent skills with routing scenarios; no provider calls will be made." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  evaluate:
    name: Routing evals (${{ matrix.skill }}, ${{ matrix.mode }})
    needs: select
    if: ${{ needs.select.outputs.has_skills == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.select.outputs.skills) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Evaluate on Codex and Claude (compare with merge base; adjacent skills candidate-only, 1 trial)
        env:
          SKILL: ${{ matrix.skill }}
          MODE: ${{ matrix.mode }}
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Empty values fall back to the defaults in scripts/routing_ceilings.py.
          ROUTING_MAX_TOKENS: ${{ vars.ROUTING_MAX_TOKENS }}
          ROUTING_MAX_COST_USD: ${{ vars.ROUTING_MAX_COST_USD }}
          ROUTING_MAX_CONCURRENCY: ${{ vars.ROUTING_MAX_CONCURRENCY }}
          ROUTING_RUN_TIMEOUT_SECONDS: ${{ vars.ROUTING_RUN_TIMEOUT_SECONDS }}
          ROUTING_JOB_TIMEOUT_SECONDS: ${{ vars.ROUTING_JOB_TIMEOUT_SECONDS }}
        run: |
          # CI always uses the pinned model and effort: never let a variable or secret leak in.
          unset ROUTING_CODEX_MODEL ROUTING_CODEX_EFFORT ROUTING_CLAUDE_MODEL ROUTING_CLAUDE_EFFORT
          # CI always runs both agents: never pass --agent, which would make a partial result.
          # (Partial runs are local-only; the guard below fails the job if a summary is partial.)
          set +e
          if [ "$MODE" = "adjacent" ]; then
            summary=".tmp/routing/reports/$SKILL.summary.json"
            ROUTING_MAX_TRIALS=1 mise run eval:routing -- skill "$SKILL"
          else
            summary=".tmp/routing/reports/$SKILL.comparison-summary.json"
            mise run eval:routing:compare -- "$SKILL" --base "$BASE_REF"
          fi
          rc=$?
          set -e
          {
            echo "### Routing eval ($MODE): $SKILL"
            echo '```json'
            cat "$summary" 2>/dev/null || echo "no summary written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          breaches="$(jq -r '.breaches // [] | map("\(.agent) \(.ceiling) limit \(.limit) observed \(.observed)") | join("; ")' "$summary" 2>/dev/null || true)"
          if [ -n "$breaches" ]; then
            echo "::warning title=ceiling::$SKILL: ceiling breached, run stopped as infra_error: $breaches"
          fi
          if [ "$(jq -r '.partial // false' "$summary" 2>/dev/null)" = "true" ]; then
            echo "::error title=partial::$SKILL ($MODE): CI must run both agents, summary is partial"
            exit 2
          fi
          # Only 0, 1 (routing_fail) and 3 (infra_error) are advisory results (docs/testing.md);
          # 2 and anything else is a harness or validation error and fails the job.
          case "$rc" in
            0) ;;
            1) echo "::warning title=routing_fail::$SKILL ($MODE): routing regressed on at least one agent (advisory)" ;;
            3) echo "::warning title=infra_error::$SKILL ($MODE): provider or telemetry failure, result incomplete (advisory)" ;;
            *) echo "::error title=harness_error::$SKILL ($MODE): exit $rc is a harness or validation error, not a routing result"; exit "$rc" ;;
          esac
      - name: Upload Promptfoo JSON (raw responses), JUnit, HTML, and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: routing-reports-${{ matrix.mode }}-${{ matrix.skill }}
          path: |
            .tmp/routing/reports/
            .tmp/promptfoo/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
