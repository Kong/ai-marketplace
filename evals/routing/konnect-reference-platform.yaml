# Baseline scenarios suggested by an agent; pending skill-owner review.
# Revision 2: symptom-only and name-lure prompts added to test beyond name matching.
skill: konnect-reference-platform
scenarios:
  - id: konnect-reference-platform-positive-1
    prompt: "We run Kong's SaaS with twelve service teams and one central team. Service teams should own their API contracts, versions and portal listings; the central team should own production routing, RBAC and the portals themselves. How do we split repos and CI tokens so that ownership actually holds?"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: konnect-reference-platform-positive-2
    prompt: "Our Kong cloud org uses a git branch per environment plus a homegrown registry file that maps service names to UUIDs. Leadership wants us to modernize onto a supported model. What should the target layout of repos and environments look like?"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: konnect-reference-platform-positive-3
    prompt: "design how a service's openapi goes from dev to prod in kong across a service repo and a central repo, ending up in the Catalog and on the gateway, with review and provenance (source commit + checksum)"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive, symptom-only, name-lure]
  - id: konnect-reference-platform-positive-4
    prompt: "Review our proposed layout: kongctl manifests for portals and Catalog in a central repo, decK files generated per service, one CI identity per team. Where are the ownership holes before we roll it out org-wide?"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive, name-lure]
  - id: konnect-reference-platform-positive-5
    prompt: "We want a working example other business units can copy in Kong: one public and one protected API, flowing from spec to Catalog to portal to gateway with app registration, split between a central repo and service repos, with promotion from dev to prod. How should it be structured, and how do we prove it works?"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive, symptom-only, name-lure]
  - id: konnect-reference-platform-positive-6
