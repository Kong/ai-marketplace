# Baseline scenarios suggested by an agent; pending skill-owner review.
skill: konnect-reference-platform
scenarios:
  - id: konnect-reference-platform-positive-1
    prompt: "We have twelve service teams and one platform team on Konnect. How should we split repos so services own their APIs and specs while the platform team keeps control of production gateway config and RBAC?"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-reference-platform-positive-2
    prompt: "Our Konnect setup uses a git branch per environment and a homegrown registry file that maps service names to UUIDs. Leadership wants a supported model. What should the target architecture look like?"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-reference-platform-positive-3
    prompt: "design how a service's openapi goes from dev to prod in konnect across a service repo and a platform repo, with review and provenance"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-reference-platform-positive-4
    prompt: "Review our proposed Konnect layout: kongctl manifests for portals and catalog in a central repo, decK files generated per service, CI identities per team. Where are the ownership holes before we roll it out org-wide?"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-reference-platform-positive-5
    prompt: "We want a working example other business units can copy: one public and one protected API, flowing from spec to Catalog to portal to gateway with app auth, split between a platform repo and service repos. How should it be structured and validated?"
    expect: [konnect-reference-platform]
    forbid: []
    trials: 3
    tags: [positive]
