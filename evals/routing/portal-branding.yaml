# Baseline scenarios suggested by an agent; pending skill-owner review.
skill: portal-branding
scenarios:
  - id: portal-branding-positive-1
    prompt: "Our developer portal home page looks nothing like northwind-freight.example. Make it use the same purple, the Inter headings, and the airy spacing from that site."
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive]
  - id: portal-branding-positive-2
    prompt: "Marketing sent a brand sheet: primary #0B6E4F, accent #F2A541, headings in Poppins, rounded 12px corners. Apply that to the getting-started page in our Konnect portal so it feels on-brand."
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive]
  - id: portal-branding-positive-3
    prompt: "make the portal landing page match our corporate site's look"
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive]
