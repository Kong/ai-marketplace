# Baseline scenarios suggested by an agent; pending skill-owner review.
# Revision 2: symptom-only and name-lure prompts added to test beyond name matching.
skill: portal-branding
scenarios:
  - id: portal-branding-positive-1
    prompt: "Make the home of our Kong developer site look like acme-robotics.example: same purple, same rounded buttons, same Inter headings, light background. The MDC files are in site/pages."
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: portal-branding-positive-2
    prompt: "Marketing redid the company website (dark navy, coral accents, a geometric sans). Our Kong developer hub still looks like the default template next to it. Get it to match. Exact colours matter, spacing can be close enough."
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: portal-branding-positive-3
    prompt: "Our corporate coral (#FF6F61) on the buttons of the Kong docs hub fails contrast on white. How do we keep the look without failing accessibility?"
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: portal-branding-positive-4
    prompt: "our main site is northwind-tools.example and the target is the getting-started page on our konnect dev hub. make the second one look like the first, side by side at desktop and phone widths. don't change the wording."
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: portal-branding-positive-5
    prompt: "Brand our Konnect Dev Portal home page so it matches our website: colours, fonts and logo."
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive]
  - id: portal-branding-positive-6
    prompt: "Design question, sort of. The layout of the page is fine as is. I just need the hero and cards to use our teal and Montserrat so the Konnect docs hub feels like part of example-bank.example."
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive, symptom-only, name-lure]
  - id: portal-branding-positive-7
    prompt: "How do I get our SVG logo onto the dev portal, and can I put a hero image on one page that isn't hosted anywhere yet? We're trying to make it look like our marketing site."
    expect: [portal-branding]
    forbid: []
    trials: 3
    tags: [positive]
  - id: portal-branding-near-miss-1
    prompt: "Write a brand voice guide for our marketing team: tone, words to avoid, and a few sample taglines."
    expect: []
    forbid: [portal-branding]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-branding-near-miss-2
    prompt: "Our portal's sitemap still lists pages we deleted months ago and search engines keep indexing them. How do we get them dropped?"
    expect: []
    forbid: [portal-branding]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-branding-near-miss-3
    prompt: "Point developers.example.com at our dev portal as a custom domain and sort out the TLS certificate for it."
    expect: []
    forbid: [portal-branding]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-branding-near-miss-4
    prompt: "Our corporate site's colours live in a Tailwind config. Port them into design tokens for our new React component library."
    expect: []
    forbid: [portal-branding]
    trials: 3
    tags: [near-miss]
  - id: portal-branding-near-miss-5
    prompt: "We restyled the portal last week and now the Orders API isn't listed there anymore. Did the theme change unpublish it?"
    expect: [konnect-api-publish]
    forbid: [portal-branding]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-branding-near-miss-6
    prompt: "Add a Status link to the top navigation of our portal and hide the Blog page from anonymous visitors."
    expect: []
    forbid: [portal-branding]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-branding-sibling-1
    prompt: "Our Konnect developer portal looks great since the rebrand, but two APIs never show up, partners can't get keys, and analytics went blank. Where do we even start?"
    expect: [konnect-platform-router]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling, name-lure]
  - id: portal-branding-sibling-2
    prompt: "Partners complain about our Konnect developer experience, and it isn't the look, that was just redone. It could be missing APIs, credentials, or timeouts. Which Konnect area owns this first?"
    expect: [konnect-platform-router]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling]
  - id: portal-branding-sibling-3
    prompt: "Colours and fonts already match the company site. Now restructure the landing page: a hero with two buttons, a three-column grid of entry cards that wraps on phones, and an expandable FAQ."
    expect: [portal-page-design]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling]
  - id: portal-branding-sibling-4
    prompt: "Brand team signed off the look. What I need now is the section order and which MDC components to use for the Payments guide so it reads top to bottom on mobile."
    expect: [portal-page-design]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling, name-lure]
  - id: portal-branding-sibling-5
    prompt: "Our dev portal homepage finally looks like the company site. The copy, though, is full of 'leverage' and 'seamless'. Rework it into plain second person."
    expect: [technical-writing]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling, name-lure]
  - id: portal-branding-sibling-6
    prompt: "Our brand guidelines say we sound friendly and direct. Edit the getting-started guide on our portal to follow that: active voice, short numbered steps, and a check at the end."
    expect: [technical-writing]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling, name-lure]
  - id: portal-branding-sibling-7
    prompt: "Our portal pages and theme are managed in Terraform. Add the new branded landing page as a resource and plan it."
    expect: [terraform-konnect]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling, name-lure]
  - id: portal-branding-sibling-8
    prompt: "We styled the pages by hand in the editor. Capture those page files in our konnect provider HCL so they stop drifting, then show the plan."
    expect: [terraform-konnect]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling]
  - id: portal-branding-sibling-9
    prompt: "Put the restyled home page MDC under our kongctl config, load it with !file, then dry-run."
    expect: [kongctl-declarative]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling]
  - id: portal-branding-sibling-10
    prompt: "kongctl manages our portal. Add the new about page from pages/about.md to the config and run plan."
    expect: [kongctl-declarative]
    forbid: [portal-branding]
    trials: 1
    tags: [sibling]
