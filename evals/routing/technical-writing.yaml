    forbid: [technical-writing]
    trials: 1
    tags: [sibling]
  - id: technical-writing-sibling-2
    prompt: "Before I touch any documentation I need to know which part of our Konnect setup is failing developers: the portal, the entries behind it, or the auth flow. The owner is unclear, so help me classify it."
    expect: [konnect-platform-router]
    forbid: [technical-writing]
    trials: 1
    tags: [sibling]
  - id: technical-writing-sibling-3
    prompt: "I have the copy for our API landing page. Now arrange it on the portal: hero, three feature columns that wrap on mobile, and an expandable FAQ."
    expect: [portal-page-design]
    forbid: [technical-writing]
    trials: 1
    tags: [sibling]
  - id: technical-writing-sibling-4
    prompt: "The writing is final. Which MDC components should hold it so the code samples sit in tabs per language and the long reference tables collapse?"
    expect: [portal-page-design]
    forbid: [technical-writing]
    trials: 1
