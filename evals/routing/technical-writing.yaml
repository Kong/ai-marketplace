  - id: technical-writing-sibling-7
    prompt: "I was asked to write docs for the Refunds API on our partner portal, but it isn't showing up there at all. It exists in Konnect. What step is missing before developers can see it?"
    expect: [konnect-api-publish]
    forbid: [technical-writing]
    trials: 1
    tags: [sibling, name-lure]
  - id: technical-writing-sibling-8
    prompt: "Docs for Loyalty are done, yet external partners see it only after logging in while it should be open to anyone on the partner site. What controls who can see it?"
    expect: [konnect-api-publish]
    forbid: [technical-writing]
    trials: 1
