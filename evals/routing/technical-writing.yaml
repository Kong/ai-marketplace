# Baseline scenarios suggested by an agent; pending skill-owner review.
# Revision 2: symptom-only and name-lure prompts added to test beyond name matching.
skill: technical-writing
scenarios:
  - id: technical-writing-positive-1
    prompt: "This guide reads like a robot made it. Tighten it, cut the filler, and switch it to second person."
    expect: [technical-writing]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: technical-writing-positive-2
    prompt: "Turn these engineering notes about our webhooks into a quickstart for outside developers: prerequisites first, everything on one page, request and response samples kept separate."
    expect: [technical-writing]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: technical-writing-positive-3
    prompt: "Draft the auth section for the Ledger page on our developer hub: how to get a key and how to send it, placeholders only. Someone else is doing the layout and the components."
    expect: [technical-writing]
    forbid: []
    trials: 3
    tags: [positive, symptom-only, name-lure]
  - id: technical-writing-positive-4
    prompt: "Our troubleshooting doc for rate limiting on Kong Gateway capitalizes service and route inconsistently and nearly every sentence is passive. Fix it to match Kong's conventions."
    expect: [technical-writing]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: technical-writing-positive-5
    prompt: "Write a how-to for our internal CLI that shows a new engineer how to rotate their local signing key, ending with a way to confirm it worked."
    expect: [technical-writing]
    forbid: []
    trials: 3
    tags: [positive]
  - id: technical-writing-positive-6
    prompt: "The hero on our portal landing says 'Unleash a seamless API ecosystem'. Make the words say what a developer can actually do there, in two lines. Leave the layout and colours alone."
    expect: [technical-writing]
    forbid: []
    trials: 3
    tags: [positive, symptom-only, name-lure]
  - id: technical-writing-positive-7
    prompt: "I documented our control planes and services for the platform team's onboarding doc, but I made up the names and example hosts. Can you go through it, swap in our real ones from Konnect, and clean up the steps?"
    expect: [technical-writing]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: technical-writing-near-miss-1
    prompt: "Write a punchy LinkedIn post announcing our new API product launch, with a couple of emojis."
    expect: []
    forbid: [technical-writing]
    trials: 3
    tags: [near-miss, name-lure]
  - id: technical-writing-near-miss-2
    prompt: "Write a Spectral ruleset that fails the build when an OpenAPI operation has no description or no example."
    expect: []
    forbid: [technical-writing]
    trials: 3
    tags: [near-miss, name-lure]
  - id: technical-writing-near-miss-3
    prompt: "Developers registered apps on our portal for the Claims API, but every credential gets a 401 at runtime. Is the auth strategy tied to the right service?"
    expect: [konnect-app-auth]
    forbid: [technical-writing]
    trials: 3
    tags: [near-miss]
  - id: technical-writing-near-miss-4
    prompt: "Write up our pricing tiers as real billing in Konnect: Starter has 10k calls included, then $2 per thousand, and Pro is a flat $300 a month."
    expect: [konnect-monetization]
    forbid: [technical-writing]
    trials: 3
    tags: [near-miss, name-lure]
  - id: technical-writing-near-miss-5
    prompt: "Write a Python script that pulls all our control planes from Konnect and dumps their names and regions to a CSV."
    expect: []
    forbid: [technical-writing]
    trials: 3
    tags: [near-miss, name-lure]
  - id: technical-writing-near-miss-6
    prompt: "Our dev portal pages read well, but the hero and cards break on mobile. Fix the component layout."
    expect: [portal-page-design]
    forbid: [technical-writing]
    trials: 3
    tags: [near-miss]
  - id: technical-writing-sibling-1
    prompt: "Partners say our Konnect developer experience is bad, and the docs were just rewritten, so it's not that. Some APIs seem missing, registrations stall, and a few calls time out. Where should we start?"
