    tags: [sibling]
  - id: portal-page-design-sibling-6
    prompt: "Page design is approved. What's left is visual parity with our corporate site: colours, fonts and logo, compared side by side at desktop and mobile widths."
    expect: [portal-branding]
    forbid: [portal-page-design]
    trials: 1
    tags: [sibling, name-lure]
  - id: portal-page-design-sibling-7
    prompt: "We keep our portal pages in HCL with the konnect provider. Add the new quickstart page from pages/quickstart.md as a resource and plan it."
    expect: [terraform-konnect]
    forbid: [portal-page-design]
    trials: 1
    tags: [sibling, name-lure]
  - id: portal-page-design-sibling-8
    prompt: "Someone created three pages by hand in the editor. Import them into our Terraform state so the next apply doesn't fight them."
    expect: [terraform-konnect]
    forbid: [portal-page-design]
    trials: 1
    tags: [sibling]
  - id: portal-page-design-sibling-9
    prompt: "Our dev portal is managed with kongctl. Add the new landing page MDC file and a snippet for the help block to the config, then run plan."
    expect: [kongctl-declarative]
    forbid: [portal-page-design]
    trials: 1
    tags: [sibling, name-lure]
  - id: portal-page-design-sibling-10
    prompt: "kongctl plan shows the getting-started content drifted from what's live. Reconcile our declarative config with the editor's version."
    expect: [kongctl-declarative]
    forbid: [portal-page-design]
    trials: 1
    tags: [sibling]
