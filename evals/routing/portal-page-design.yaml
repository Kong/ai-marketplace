# Baseline scenarios suggested by an agent; pending skill-owner review.
# Revision 2: symptom-only and name-lure prompts added to test beyond name matching.
skill: portal-page-design
scenarios:
  - id: portal-page-design-positive-1
    prompt: "The home of our Kong developer hub is one long wall of markdown. I want a big header with a title and two buttons, then a row of three cards for Quickstart, Reference and Support that stack on phones."
    expect: [portal-page-design]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: portal-page-design-positive-2
    prompt: "Which MDC component should hold request and response samples so they sit side by side on desktop but stack on mobile?"
    expect: [portal-page-design]
    forbid: []
    trials: 3
    tags: [positive]
  - id: portal-page-design-positive-3
    prompt: "the cards on our konnect dev hub landing overflow the screen on phones and the buttons touch each other. how should that section be built so it reflows"
    expect: [portal-page-design]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: portal-page-design-positive-4
    prompt: "We paste the same 'Need help?' block with a contact button into 12 docs on our Kong developer hub. Every change means editing all 12. How should that be structured instead?"
    expect: [portal-page-design]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: portal-page-design-positive-5
    prompt: "Design a Konnect Dev Portal page for the Payments API with sections for getting started, auth, request and response, and troubleshooting."
    expect: [portal-page-design]
    forbid: []
    trials: 3
    tags: [positive]
  - id: portal-page-design-positive-6
    prompt: "Brand colours are already set in the theme, so don't touch those. I need the structure: tabbed panels for the SDK languages and collapsible FAQ entries on the Ledger guide in our Kong developer hub."
    expect: [portal-page-design]
    forbid: []
    trials: 3
    tags: [positive, symptom-only, name-lure]
  - id: portal-page-design-positive-7
    prompt: "I tried <div class=\"grid\"> on a page in the new Konnect portal and it renders as literal text. How should a grid of items be written there?"
    expect: [portal-page-design]
    forbid: []
    trials: 3
    tags: [positive]
  - id: portal-page-design-near-miss-1
    prompt: "Our Kong Gateway Enterprise 2.8 workspace portal still uses the old Lua-templated layouts. Fix the partial that renders the sidebar."
    expect: []
    forbid: [portal-page-design]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-page-design-near-miss-2
    prompt: "Make the pricing page on our Next.js marketing site responsive with Tailwind; the plan cards squash together on tablets."
    expect: []
    forbid: [portal-page-design]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-page-design-near-miss-3
    prompt: "We built a new landing page for the partner portal, but partner developers don't see the Orders API in its list at all, while internal developers see it on the other portal."
    expect: [konnect-api-publish]
    forbid: [portal-page-design]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-page-design-near-miss-4
    prompt: "Restrict the Partners page on our portal so only signed-in developers can see it, and hide it from the navigation for everyone else."
    expect: []
    forbid: [portal-page-design]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-page-design-near-miss-5
    prompt: "Draft a design doc for moving our internal auth service from session cookies to OAuth 2.1, with alternatives considered."
    expect: []
    forbid: [portal-page-design]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-page-design-near-miss-6
    prompt: "Developers on our portal click Register on the Claims API page, the form submits, but no application ever shows up in their account."
    expect: [konnect-app-auth]
    forbid: [portal-page-design]
    trials: 3
    tags: [near-miss, name-lure]
  - id: portal-page-design-sibling-1
    prompt: "Our Konnect developer portal pages are laid out fine, but partners still complain: some APIs are missing and keys never arrive. Which part do we look at first?"
    expect: [konnect-platform-router]
    forbid: [portal-page-design]
    trials: 1
    tags: [sibling, name-lure]
  - id: portal-page-design-sibling-2
    prompt: "Leadership says our Konnect developer experience is poor, even after the page redesign. Is it APIs that are missing, credentials, or the gateway itself? It's unclear to me who owns the investigation."
    expect: [konnect-platform-router]
    forbid: [portal-page-design]
    trials: 1
    tags: [sibling]
  - id: portal-page-design-sibling-3
