# Baseline scenarios suggested by an agent; pending skill-owner review.
# Revision 2: symptom-only and name-lure prompts added to test beyond name matching.
skill: kongctl-query
scenarios:
  - id: kongctl-query-positive-1
    prompt: "From a terminal, what's the read-only command to list the routes under one specific Konnect control plane? I keep guessing the get subcommand and getting 'unknown command'."
    expect: [kongctl-query]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: kongctl-query-positive-2
    prompt: "Our CI runner authenticates to Konnect with a system token from an env var. What's the smallest CLI read that proves the token works and shows which org and region it lands in? Don't print the token anywhere."
    expect: [kongctl-query]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: kongctl-query-positive-3
    prompt: "need a terminal one-liner that prints only the name and id of every developer portal in our konnect org, as JSON, for a ticket. look only, no changes."
    expect: [kongctl-query]
    forbid: []
    trials: 3
    tags: [positive, symptom-only, name-lure]
  - id: kongctl-query-positive-4
    prompt: "A teammate just applied our declarative change that should add v2 to the loyalty API. Give me the exact kongctl read I can rerun to prove the version exists now; I don't want to run another plan."
