    prompt: "Producers on the payments team authenticate with SASL/PLAIN through the Kong Kafka proxy just fine, but every produce to payments.settled fails with TOPIC_AUTHORIZATION_FAILED. Consumers with the same credentials can read it. Is something in Kong rejecting the writes?"
