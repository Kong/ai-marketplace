skill: konnect-event-gateway
scenarios:
  - id: konnect-event-gateway-positive-1
    prompt: "Kafka clients going through Kong's Kafka proxy get a clean TLS handshake, then UNKNOWN_TOPIC_OR_PARTITION for orders.v2, which definitely exists on the MSK cluster behind it. Which hop is wrong?"
    expect: [konnect-event-gateway]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
