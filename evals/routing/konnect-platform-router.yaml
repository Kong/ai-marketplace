# Pilot scenarios plus a baseline top-up suggested by an agent; the top-up is pending skill-owner review.
# Top-up: platform-router-positive-4..5, near-miss-5..6, sibling-3..11; near-miss-4 (was sibling-2) retagged.
skill: konnect-platform-router
scenarios:
