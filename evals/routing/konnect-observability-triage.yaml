    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-observability-triage-positive-4
    prompt: "Explorer has data for the checkout API, but the custom report I built filtered to consumer groups shows nothing for the same week. Wrong dataset, wrong filter, or is something not being collected?"
