# Baseline scenarios suggested by an agent; pending skill-owner review.
skill: konnect-observability-triage
scenarios:
  - id: konnect-observability-triage-positive-1
    prompt: "Requests are definitely going through our Konnect gateways, I can see them in the upstream logs, but the analytics charts for the checkout service stop at Tuesday. Where did the data go?"
    expect: [konnect-observability-triage]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-observability-triage-positive-2
    prompt: "Explorer shows traffic for two of our five control planes. The other three are serving production load. Is this a scope thing or are we losing telemetry?"
    expect: [konnect-observability-triage]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-observability-triage-positive-3
    prompt: "I tried to capture a trace in Debugger for a failing request on the orders route and the session comes back with nothing, even though I reproduced the call a dozen times."
