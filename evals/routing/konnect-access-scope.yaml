# Baseline scenarios suggested by an agent; pending skill-owner review.
skill: konnect-access-scope
scenarios:
  - id: konnect-access-scope-positive-1
    prompt: "New hire on the platform team logs into Konnect and the Gateway Manager page is just empty for her. Everyone else on the team sees our four control planes. Why?"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-access-scope-positive-2
    prompt: "My personal access token works with curl against the US API but every call returns 401 once I point at eu.api.konghq.com. Is the token tied to one geo?"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-access-scope-positive-3
    prompt: "I can open the payments control plane and read its routes, but the Save button is greyed out whenever I try to change a plugin. Who decides that?"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-access-scope-positive-4
    prompt: "We moved Konnect login to Okta last month. Now I want to add Priya to the analytics-viewers team in the Konnect UI but the membership controls won't let me touch her. What's going on?"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive]
  - id: konnect-access-scope-positive-5
    prompt: "Strange one: a contractor who should only manage the staging portal somehow deleted a service in production. How did they end up with that much power in our org?"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive]
