    forbid: []
    trials: 3
    tags: [positive, name-lure]
  - id: konnect-access-scope-positive-8
    prompt: "Odd one: a contractor who should only manage the staging portal somehow deleted a service on the production control plane. How did they end up able to do that in our org?"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
