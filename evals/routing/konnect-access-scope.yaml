    forbid: [konnect-access-scope]
    trials: 1
    tags: [sibling]
  - id: konnect-access-scope-sibling-2
    prompt: "A partner says our Konnect-hosted API returns 403 for them since Tuesday. I can't tell if their developer app lost its credential or someone on our side changed the gateway config."
