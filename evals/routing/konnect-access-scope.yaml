    expect: []
    forbid: [konnect-access-scope]
    trials: 3
    tags: [near-miss]
  - id: konnect-access-scope-sibling-1
    prompt: "Since we merged two Konnect orgs, half the team can't find things, our partner portal stopped listing APIs, and analytics look thin. I can't tell whether this is permissions or broken setup. Which area do I start with?"
