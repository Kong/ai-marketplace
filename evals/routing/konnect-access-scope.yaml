# Baseline scenarios suggested by an agent; pending skill-owner review.
# Revision 2: symptom-only and name-lure prompts added to test beyond name matching.
skill: konnect-access-scope
scenarios:
  - id: konnect-access-scope-positive-1
    prompt: "A new hire accepted their Konnect invite yesterday and logs in to an empty list of CPs. The rest of the platform team sees our four. Same org name in the top bar."
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: konnect-access-scope-positive-2
    prompt: "My token works with curl against the US Konnect API, but every call returns 401 Unauthorized as soon as I switch the base URL to the EU one. Is a token tied to one geo, or did I set something up wrong?"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: konnect-access-scope-positive-3
    prompt: "I can open the payments CP in Konnect and read every route, but the Save button is greyed out whenever I edit a plugin. A teammate on another team can save the same plugin. Who decides that?"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: konnect-access-scope-positive-4
    prompt: "Since Konnect login moved to Okta, the UI won't let me add a teammate to the analytics-viewers team. The membership controls are just disabled for that user. What's going on?"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: konnect-access-scope-positive-5
    prompt: "konnect: can see the cp, can't change anything in it. org admin swears i'm on the right team"
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive, symptom-only]
  - id: konnect-access-scope-positive-6
    prompt: "Gateway Manager shows 'no control planes' when our deploy bot's system account token calls it, while I see six in the UI. The bot was created last week."
    expect: [konnect-access-scope]
    forbid: []
    trials: 3
    tags: [positive, name-lure]
  - id: konnect-access-scope-positive-7
    prompt: "Our release automation can list the application auth strategies in Konnect but gets 403 the moment it tries to create one. Same token, same org."
